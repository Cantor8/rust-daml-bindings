[package]
name = "daml-derive"
version = "0.3.0"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "Daml Ledger Procedural Macro"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
rust-version = "1.75"

[lib]
proc-macro = true

[dependencies]
daml-codegen = { version = "0.3.0", path = "../daml-codegen" }
daml-lf = { version = "0.3.0", path = "../daml-lf" }
syn = { version = "2.0.118", features = ["full"] }
quote = "1.0.46"
proc-macro2 = "1.0.106"
darling = "0.23.0"
itertools = "0.15.0"

# Phase 8 dropped the v1 attribute/codegen test trees outright;
# the macro surface still has coverage via doc-tests embedded in
# its own source files. A round-trip suite around the v2 attribute
# macros (#[DamlTemplate] + #[DamlInterface]) is a planned
# follow-up.

# Pulled in for doctests so `use daml::prelude::*;` resolves. The
# circularity (daml → daml-derive → daml) is OK because dev-deps
# only affect the test build and proc-macro crates compile
# independently of their dev-dep graph.
[dev-dependencies]
daml = { path = "../daml", features = [ "prelude", "derive" ] }
