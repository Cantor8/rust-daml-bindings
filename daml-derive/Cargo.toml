[package]
name = "daml-derive"
version = "0.2.2"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "Daml Ledger Procedural Macro"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
rust-version = "1.59.0"

[lib]
proc-macro = true

[dependencies]
daml-codegen = { version = "0.2.2", path = "../daml-codegen" }
daml-lf = { version = "0.2.2", path = "../daml-lf" }
syn = { version = "1.0.86", features = ["full"] }
quote = "1.0.15"
proc-macro2 = "1.0.36"
darling = "0.13.1"
itertools = "0.10.3"

# Phase 8 dropped the v1 attribute/codegen test trees outright;
# the macro surface still has coverage via doc-tests embedded in
# its own source files. A round-trip suite around the v2 attribute
# macros (#[DamlTemplate] + #[DamlInterface]) is a planned
# follow-up.
