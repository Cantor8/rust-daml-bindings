[package]
name = "daml-grpc"
version = "0.3.0"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "Daml Ledger GRPC API"
readme = "README.md"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[features]
default = [ "admin" ]
admin = []
# Gates the live-sandbox smoke test. Off by default so
# `cargo test` doesn't try to dial a participant; turn on with
# `cargo test -p daml-grpc --features integration` after starting
# canton-sandbox.
integration = []

[dependencies]
futures = "0.3.21"
uuid = { version = "1.23.2", features = [ "v4" ] }
chrono = "0.4.19"
bigdecimal = "0.3.0"
bytes = "1.1.0"
tonic = { version = "0.6.2", features = [ "tls", "tls-roots" ] }
hyper = { version = "0.14.17", features = [ "full" ] } # TODO remove when tonic support connect timeout
prost = "0.9.0"
prost-derive = "0.9.0"
prost-types = "0.9.0"
async-trait = "0.1.52"
itertools = "0.10.3"
tracing = "0.1.31"

# dev-dependencies are kept minimal here; the Phase 8 v2
# integration smoke test lives in its own crate-local target
# gated by `--features integration`.
[dev-dependencies]
daml = { path = "../daml", features = [ "lf", "util" ] }
tokio = { version = "1.17.0", features = [ "macros", "rt-multi-thread" ] }
anyhow = "1.0.55"
tracing-subscriber = { version = "0.3.9", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.6.2"
itertools = "0.10.3"

[package.metadata.docs.rs]
all-features = true