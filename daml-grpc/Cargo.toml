[package]
name = "daml-grpc"
version = "0.3.0"
authors = ["drsk0 <drsk0@proton.me>", "FujiApple <fujiapple852@gmail.com>"]
description = "Daml Ledger GRPC API"
readme = "README.md"
repository = "https://github.com/Cantor8/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2024"
rust-version = "1.96.0"
build = "build.rs"

[features]
default = [ "admin" ]
admin = []
# Gates the live-sandbox smoke test. Off by default so
# `cargo test` doesn't try to dial a participant; turn on with
# `cargo test -p daml-grpc --features integration` after starting
# canton-sandbox.
integration = []

[dependencies]
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bigdecimal = { workspace = true }
bytes = { workspace = true }
tonic = { version = "0.14.6", features = [ "tls-ring", "tls-native-roots" ] }
tonic-prost = "0.14.6"
prost = { workspace = true }
prost-derive = { workspace = true }
prost-types = "0.14.4"
async-trait = "0.1.89"
itertools = { workspace = true }
tracing = "0.1.44"
thiserror = { workspace = true }

# dev-dependencies are kept minimal here; the v2 integration
# smoke test lives in its own crate-local target gated by
# `--features integration`.
[dev-dependencies]
daml = { path = "../daml", features = [ "lf", "util" ] }
tokio = { version = "1.52", features = [ "macros", "rt-multi-thread" ] }
anyhow = "1.0.103"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
itertools = { workspace = true }

[package.metadata.docs.rs]
all-features = true