on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

name: Continuous integration

jobs:

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: check --workspace
        run: cargo check --workspace

      - name: check --workspace --no-default-features
        run: cargo check --workspace --no-default-features

      # Per-feature matrix: every flag the daml umbrella still ships
      # after the v2 migration. The dropped features (json, bridge,
      # sandbox) and the deleted crates (daml-json, daml-bridge) no
      # longer need coverage.
      - name: check --features grpc
        run: cargo check -p daml --no-default-features --features grpc

      - name: check --features macros
        run: cargo check -p daml --no-default-features --features macros

      - name: check --features derive
        run: cargo check -p daml --no-default-features --features derive

      - name: check --features codegen
        run: cargo check -p daml --no-default-features --features codegen

      - name: check --features lf
        run: cargo check -p daml --no-default-features --features lf

      - name: check --features lf-full
        run: cargo check -p daml --no-default-features --features lf-full

      - name: check --features util
        run: cargo check -p daml --no-default-features --features util

      - name: check --features prelude
        run: cargo check -p daml --no-default-features --features prelude

      - name: check --features full
        run: cargo check -p daml --no-default-features --features full

      - name: check --all-features
        run: cargo check --workspace --all-features

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: test --workspace --lib
        run: cargo test --workspace --lib

      - name: test --workspace --doc
        run: cargo test --workspace --doc

      # The daml-lf crate's integration tests load a small LF2 DAR
      # fixture from disk -- they do not need a live ledger and
      # belong in this surface.
      - name: test -p daml-lf --tests
        run: cargo test -p daml-lf --tests

  # The Phase 8 smoke test (`-p daml-grpc --features integration`)
  # needs a running Canton sandbox and is gated off the default
  # matrix. See README's "Integration tests" section for the local
  # workflow; CI can pick it up later by booting `canton-sandbox`
  # from the Nix flake before invoking cargo.

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - name: fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: clippy --workspace --tests
        run: cargo clippy --workspace --tests -- -Dwarnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          log-level: warn
          command: check
          arguments: --all-features
