on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

name: Continuous integration

jobs:

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: check --workspace
        run: cargo check --workspace

      - name: check --workspace --no-default-features
        run: cargo check --workspace --no-default-features

      # Per-feature matrix: every flag the daml umbrella still ships
      # after the v2 migration. The dropped features (json, bridge,
      # sandbox) and the deleted crates (daml-json, daml-bridge) no
      # longer need coverage.
      - name: check --features grpc
        run: cargo check -p daml --no-default-features --features grpc

      - name: check --features macros
        run: cargo check -p daml --no-default-features --features macros

      - name: check --features derive
        run: cargo check -p daml --no-default-features --features derive

      - name: check --features codegen
        run: cargo check -p daml --no-default-features --features codegen

      - name: check --features lf
        run: cargo check -p daml --no-default-features --features lf

      - name: check --features lf-full
        run: cargo check -p daml --no-default-features --features lf-full

      - name: check --features util
        run: cargo check -p daml --no-default-features --features util

      - name: check --features prelude
        run: cargo check -p daml --no-default-features --features prelude

      - name: check --features full
        run: cargo check -p daml --no-default-features --features full

      - name: check --all-features
        run: cargo check --workspace --all-features

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: test --workspace --lib
        run: cargo test --workspace --lib

      - name: test --workspace --doc
        run: cargo test --workspace --doc

      # The daml-lf crate's integration tests load a small LF2 DAR
      # fixture from disk -- they do not need a live ledger and
      # belong in this surface.
      - name: test -p daml-lf --tests
        run: cargo test -p daml-lf --tests

  # Live-sandbox smoke test: boots Canton 3.5.1 out of the Nix
  # flake and runs `-p daml-grpc --features integration` against
  # it. Same tooling as the local workflow — see README's
  # "Integration tests" section — so a green CI run means the
  # Nix-pinned Canton + fixture DAR + client bindings agree
  # end-to-end.
  integration:
    runs-on: ubuntu-latest
    # Skip on draft PRs to keep runner minutes reasonable — the
    # rest of the matrix is fast enough that iterating on a draft
    # doesn't need the ~2-min sandbox boot.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Start Canton sandbox
        run: |
          nohup nix develop --command canton-sandbox > canton-sandbox.log 2>&1 &
          # Wait up to 2 minutes for the Ledger API port to accept
          # connections. Canton boot on a cold runner is ~30-45 s.
          for i in $(seq 1 60); do
            nc -z localhost 5011 && exit 0
            sleep 2
          done
          echo "canton-sandbox never came up on localhost:5011" >&2
          exit 1

      - name: Run integration test
        run: |
          nix develop --command cargo test \
            -p daml-grpc --features integration \
            --test integration -- --nocapture

      # Surface Canton-side logs when the test failed so failures
      # are diagnosable without an SSH into the runner.
      - name: Dump canton-sandbox log
        if: failure()
        run: tail -n 200 canton-sandbox.log || true

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - name: fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: clippy --workspace --tests
        run: cargo clippy --workspace --tests -- -Dwarnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
          arguments: --all-features
