# cargo-deny configuration.
#
# Bump the `version = 2` markers below if cargo-deny's schema
# changes again — the previous file was on the pre-v2 schema which
# has been removed.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

# Crates whose license expression cargo-deny can't infer from a
# SPDX field alone; the file hash pins the clarification to a
# specific LICENSE / COPYRIGHT file.
[[licenses.clarify]]
name = "encoding_rs"
version = "*"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [
    { path = "COPYRIGHT", hash = 0x39f8ad31 }
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[bans]
# Duplicate versions are unavoidable in a tonic + prost workspace
# — allow them and rely on advisory checks for the real risk.
multiple-versions = "allow"
