[package]
name = "daml-lf"
version = "0.3.0"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "API for working with Daml-LF data"
readme = "README.md"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[features]
default = []
full = []

[dependencies]
bytes = "1.12.0"
prost = { version = "0.14.4", features = [ "no-recursion-limit" ] }
prost-derive = "0.14.4"
zip = { version = "8.6.0", default-features = false, features = [ "deflate-flate2-zlib-rs" ] }
yaml-rust2 = "0.11.0"
itertools = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
bounded-static = { version = "0.8.0", features = [ "derive" ] }

[dev-dependencies]
trim-margin = "0.1.0"

[build-dependencies]
prost-build = "0.14.4"
itertools = "0.15.0"

[package.metadata.docs.rs]
all-features = true