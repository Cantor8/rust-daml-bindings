[package]
name = "grpc-demo"
version = "0.1.0"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "Daml GRPC API demo application"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
rust-version = "1.59.0"

publish = false

[dependencies]
# The stub doesn't pull anything from the daml crate; the deps are
# kept here as breadcrumbs for the v2 rewrite landing alongside the
# Phase 7 LF2 fixtures + Phase 8 integration harness.
daml = { path = "../../daml", features = [ "grpc", "util", "macros" ] }

