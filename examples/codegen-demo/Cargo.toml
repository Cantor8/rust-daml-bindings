[package]
name = "codegen-demo"
version = "0.1.0"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "Daml Codegen demo application"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
build = "build.rs"
rust-version = "1.75"

publish = false

[dependencies]
daml = { path = "../../daml", features = [ "prelude", "grpc", "util", "macros" ] }
tokio = { version = "1.52", features = [ "macros", "rt-multi-thread" ] }
anyhow = "1.0.103"

[build-dependencies]
daml = { path = "../../daml", features = [ "codegen" ] }

[workspace]