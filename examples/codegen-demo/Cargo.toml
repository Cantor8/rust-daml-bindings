[package]
name = "codegen-demo"
version = "0.1.0"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "Daml Codegen demo application"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
build = "build.rs"
rust-version = "1.75"

publish = false

[dependencies]
# The stub doesn't pull anything from the daml crate; the deps are
# kept here as breadcrumbs for the v2 rewrite landing alongside the
# Phase 7 LF2 fixtures + Phase 8 integration harness.
daml = { path = "../../daml", features = [ "prelude", "grpc" ] }

[build-dependencies]
# Re-enabled when Phase 7's LF2 DAR fixture lands.
daml = { path = "../../daml", features = [ "codegen" ] }

[workspace]