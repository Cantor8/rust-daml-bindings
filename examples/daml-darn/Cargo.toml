[package]
name = "daml-darn"
version = "0.4.0"
authors = ["drsk0 <drsk0@proton.me>", "FujiApple <fujiapple852@gmail.com>"]
description = "Tools for working with Daml Archives and ledgers"
readme = "README.md"
repository = "https://github.com/drsk0/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2024"
rust-version = "1.96.0"

[dependencies]
daml = { version = "0.4.0", path = "../../daml", features = [ "grpc", "lf-full", "util" ] }
tokio = { version = "1.52", features = [ "macros", "rt-multi-thread" ] }
clap = { version = "4.6.1", features = [ "cargo" ] }
prettytable-rs = "0.10.0"
itertools = "0.15.0"
anyhow = "1.0.103"
thiserror = "2.0.18"

[workspace]