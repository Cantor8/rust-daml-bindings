[package]
name = "daml-util"
version = "0.3.0"
authors = ["drsk0 <drsk0@proton.me>", "FujiApple <fujiapple852@gmail.com>"]
description = "Helper utilities for working with the Daml Ledgers"
readme = "README.md"
repository = "https://github.com/Cantor8/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2024"
rust-version = "1.96.0"

[dependencies]
daml-grpc = { version = "0.3.0", path = "../daml-grpc" }
daml-lf = { version = "0.3.0", path = "../daml-lf", features = [ "full" ] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.150"
uuid = { workspace = true }
# v2 Canton JWT builder (HS256 / RS256 / ES256 signing).
jsonwebtoken = { version = "10.3.0", features = [ "aws_lc_rs" ] }
chrono = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { version = "1.52", features = [ "macros", "rt-multi-thread" ] }

[package.metadata.docs.rs]
all-features = true