[package]
name = "daml-util"
version = "0.3.0"
authors = ["FujiApple <fujiapple852@gmail.com>"]
description = "Helper utilities for working with the Daml Ledgers"
readme = "README.md"
repository = "https://github.com/fujiapple852/rust-daml-bindings"
license = "Apache-2.0"
keywords = ["daml", "api", "ledger"]
categories = ["development-tools"]
edition = "2021"
rust-version = "1.75"

[dependencies]
daml-grpc = { version = "0.3.0", path = "../daml-grpc" }
daml-lf = { version = "0.3.0", path = "../daml-lf" }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.4", features = [ "v4" ] }
# v2 Canton JWT builder (HS256 / RS256 / ES256 signing).
jsonwebtoken = { version = "10.4.0", features = [ "aws_lc_rs" ] }
chrono = "0.4.45"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.52", features = [ "macros", "rt-multi-thread" ] }

[package.metadata.docs.rs]
all-features = true