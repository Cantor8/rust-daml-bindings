// Local sandbox topology for rust-daml-bindings integration tests.
//
// One participant + one embedded synchronizer (sequencer + mediator),
// all in-memory. Bootstrapping is done by sandbox.canton.
//
// Start with: canton-sandbox  (from the Nix dev shell)
// or:        canton daemon -c canton/sandbox.conf --bootstrap canton/sandbox.canton
//
// Ledger API: localhost:5011
// Admin  API: localhost:5012

canton {
  sequencers.sequencer1 {
    storage.type = memory
    public-api.port = 5001
    admin-api.port = 5002
    sequencer.type = BFT
  }

  mediators.mediator1 {
    storage.type = memory
    admin-api.port = 5202
  }

  participants.sandbox {
    storage.type = memory
    ledger-api {
      address = "0.0.0.0"
      port = 5011
    }
    admin-api {
      address = "0.0.0.0"
      port = 5012
    }
    // We only need the gRPC ledger API for the Rust client; disable the
    // bundled HTTP JSON service.
    http-ledger-api.enabled = false
  }
}
